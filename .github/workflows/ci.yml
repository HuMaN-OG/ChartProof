name: Verify ChartProof
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y tesseract-ocr tesseract-ocr-eng fonts-dejavu-core
      - run: pip install -r requirements-dev.txt
      - run: python -m unittest discover -s tests -v
      - run: python tools/benchmark.py --out /tmp/chartproof-results.json
      - name: Check controlled evaluation results
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path('/tmp/chartproof-results.json').read_text())
          assert report['verdict_total'] == report['verdict_correct'] == 180
          assert report['ocr_pairs_correct'] == report['ocr_pairs_total'] == 84
          assert report['cosmetic_alerts'] == 0
          PY
      - run: pip install playwright && python -m playwright install --with-deps chromium
      - run: python tools/browser_smoke.py
      - run: docker build -t chartproof .
      - name: Smoke test packaged service
        run: |
          docker run -d --name chartproof-ci -p 8090:8000 chartproof
          curl --fail --silent --show-error --retry 15 --retry-delay 2 --retry-all-errors --max-time 8 http://127.0.0.1:8090/healthz |
            python -c "import json, sys; assert json.load(sys.stdin)['local_ocr'] is True"
          curl --fail --silent --show-error --max-time 45 http://127.0.0.1:8090/api/sample/original |
            python -c "import json, sys; chart = json.load(sys.stdin); assert chart['reviewed'] and {r['year']: r['value'] for r in chart['rows']}['2025'] == '72'"
      - name: Show container log on smoke-test failure
        if: failure()
        run: docker logs chartproof-ci 2>/dev/null || true
